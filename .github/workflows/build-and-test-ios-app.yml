name: build-and-test-ios-app

on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_call:
  workflow_dispatch:
    
jobs:
  tests:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select compatible Xcode and print versions
        run: scripts/select-ci-xcode.sh iphonesimulator

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cache Swift package dependencies
        uses: actions/cache@v6
        with:
          path: build/test-derived-data/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ArtemisKit/Package.swift', 'Artemis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Test CI verification helpers
        run: |
          ruby scripts/tests/check_build_warnings_test.rb
          ruby scripts/tests/setup_ci_ruby_test.rb
          ruby scripts/tests/select_ci_xcode_test.rb
          ruby scripts/tests/xcodebuild_diagnostics_test.rb
          ruby scripts/tests/lint_test.rb

      - name: Run ArtemisKit tests
        run: bundle exec fastlane test

      - name: Require warning-free static code quality
        run: bundle exec fastlane swift_lint

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/test-results/
          retention-days: 14

  build:
    needs: tests
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: [self-hosted, macOS]
    steps:
      - name: Require passing tests
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::ArtemisKit tests did not pass ($TEST_RESULT)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Select compatible Xcode and print versions
        run: scripts/select-ci-xcode.sh iphoneos

      - name: Install required Ruby and gems
        run: scripts/setup-ci-ruby.sh

      - name: Print versions
        run: ruby -v

      - name: Resolve build dependencies
        run: xcodebuild -resolvePackageDependencies -project Artemis.xcodeproj -scheme Artemis -clonedSourcePackagesDirPath .SwiftPackages -skipMacroValidation -skipPackagePluginValidation

      - name: Check static code quality of iOS App
        run: bundle exec fastlane swift_lint

      - name: Generate build number
        run: |
          # Build number is current date/time in format YYYYMMDDHHMM
          BUILD_NUMBER=$(date +'%Y%m%d%H%M')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build is $(date +'%Y%m%d%H%M')"
        
      - name: Build iOS App 
        run: bundle exec fastlane build
        env: 
          MATCH_GITLAB_AUTH: ${{ secrets.IOS_MATCH_GITLAB_AUTH }}
          MATCH_PASSWORD: ${{ secrets.IOS_MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.IOS_MATCH_GIT_URL }}
          API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_PASSWORD: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_PASSWORD }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-app
          path: /opt/actions-runner/_work/artemis-ios/artemis-ios/build/App.ipa
